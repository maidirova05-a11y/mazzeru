<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mazzeru — сторис и Актуальное</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ddd; font-family: "Inter Tight", sans-serif; }
  .page { position: relative; width: 1080px; height: 1920px; overflow: hidden; margin: 0 auto 40px; }
  .abs { position: absolute; }
  .circle { position: absolute; border-radius: 50%; }
  .label { font-family: "Inter Tight", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 9px; text-transform: uppercase; line-height: 1.2; }
  .h { font-family: "Inter Tight", sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -6px; line-height: 0.9; }
  .btntext { font-family: "Inter Tight", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 6px; text-transform: uppercase; }
  .body { font-family: "Inter Tight", sans-serif; font-weight: 400; font-size: 40px; line-height: 1.4; }
</style>
</head>
<body>

<!-- Сторис: новый кейс -->
<section class="page" data-document-role="page" data-label="Сторис · Новый кейс" style="background:#FAF8F2">
  <div class="circle" style="width:560px;height:560px;background:#E7FF00;left:-160px;top:1480px"></div>
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/story-photo.jpg" alt="Фото" style="left:40px;top:640px;width:1000px;height:1000px;border-radius:50%;object-fit:cover">
  <img class="abs" src="https://mazzeru-brand.vercel.app/files/logo/mazzeru-logo-blue.png" alt="Логотип mazzeru" style="left:80px;top:250px;width:440px;height:46px">
  <div class="abs h" style="left:76px;top:360px;width:920px;font-size:140px;color:#0B0B0F">Новый <span style="color:#0047FF">кейс</span></div>
  <div class="abs label" style="left:84px;top:530px;color:#5D5C66">Мобилография · Reels</div>
  <div class="abs" style="left:560px;top:1480px;width:440px;height:104px;background:#E7FF00;border-radius:52px"></div>
  <div class="abs btntext" style="left:610px;top:1515px;color:#0B0B0F">Смотреть →</div>
</section>

<!-- Сторис: анонс / вопрос -->
<section class="page" data-document-role="page" data-label="Сторис · Анонс" style="background:#0047FF">
  <div class="circle" style="width:900px;height:900px;background:#E7FF00;left:380px;top:1300px"></div>
  <img class="abs" src="https://mazzeru-brand.vercel.app/files/logo/mazzeru-logo-white.png" alt="Логотип mazzeru" style="left:80px;top:250px;width:440px;height:46px">
  <div class="abs label" style="left:84px;top:520px;color:#E7FF00">Скоро в профиле</div>
  <div class="abs h" style="left:76px;top:590px;width:920px;font-size:150px;color:#FFFFFF">Love story<br>за 5 дней</div>
  <div class="abs body" style="left:84px;top:960px;width:860px;color:#FFFFFF">ИИ-фильм о вашей истории — по 10–30 фотографиям. Напишите «хочу» в директ.</div>
  <img class="abs" src="https://mazzeru-brand.vercel.app/files/logo/mazzeru-mark-white.png" alt="Знак ZZ" style="left:80px;top:1560px;width:120px;height:120px">
</section>

<!-- Обложки «Актуального» -->
<section class="page" data-document-role="page" data-label="Актуальное · ИИ" style="background:#0047FF">
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/icon-ai.svg" alt="ИИ" style="left:330px;top:750px;width:420px;height:420px">
</section>
<section class="page" data-document-role="page" data-label="Актуальное · Сайты" style="background:#0B0B0F">
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/icon-web.svg" alt="Сайты" style="left:330px;top:750px;width:420px;height:420px">
</section>
<section class="page" data-document-role="page" data-label="Актуальное · Мобило" style="background:#E7FF00">
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/icon-mobile.svg" alt="Мобилография" style="left:330px;top:750px;width:420px;height:420px">
</section>
<section class="page" data-document-role="page" data-label="Актуальное · Цены" style="background:#0047FF">
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/icon-price.svg" alt="Цены" style="left:330px;top:750px;width:420px;height:420px">
</section>
<section class="page" data-document-role="page" data-label="Актуальное · Команда" style="background:#FAF8F2">
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/icon-team.svg" alt="Команда" style="left:330px;top:750px;width:420px;height:420px">
</section>
<section class="page" data-document-role="page" data-label="Актуальное · Отзывы" style="background:#E7FF00">
  <img class="abs" src="https://mazzeru-brand.vercel.app/canva/img/icon-reviews.svg" alt="Отзывы" style="left:330px;top:750px;width:420px;height:420px">
</section>

</body>
</html>
